      - "What should we stop doing right now?"
      - "What is our next bottleneck?"
    do_not_use_for:
      - "Write launch ads for this webinar"
      - "Draft a price increase letter"
  - id: hormozi-team-scaling
    alias: /hormozi-team-scaling
    implementation_status: available
    distribution_status: public
    public_handling: user-supplied
    job: "Install team communication, service, and operating-system frameworks for scale."
    use_when:
      - "Install a better weekly management cadence"
      - "Service quality is slipping as we scale"
      - "How should raises work on this team?"
    do_not_use_for:
      - "What stage is the company in?"
      - "Create a lead nurture sequence"
  - id: hormozi-launch-campaigns
    alias: /hormozi-launch-campaigns
    implementation_status: available
    distribution_status: public
    public_handling: user-supplied
    job: "Design launches, affiliate systems, VSL funnels, and page-flow orchestration."
    use_when:
      - "Plan a live launch funnel for this product"
      - "Build the affiliate rollout and prize structure"
      - "Map the registration-to-upsell page flow"
    do_not_use_for:
      - "Improve evergreen churn"
      - "Diagnose what stage our business is in"
